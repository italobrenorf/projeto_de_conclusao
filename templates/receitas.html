<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/style.css">
    <title>Receitas Sugeridas - Niemann-Pick</title>
    {% load static %}

    <!-- Disponibiliza a URL correta do JSON para o app.js -->
    <script defer>
        window.RECIPES_JSON_URL = "{% static 'data/receitas.json' %}";
    </script>

    <!-- Carrega o script principal UMA ÚNICA VEZ -->
    <script src="{% static 'js/app.js' %}" defer></script>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="page-container">
        <header>
            <h1>Receitas Sugeridas</h1>
        </header>

        <main>
            <!-- Formulário de filtros -->
            <form id="filtros" class="filtros-form">
                <div class="form-group">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria">
                        <option value="">Todas</option>
                        <option value="Prato Principal">Prato Principal</option>
                        <option value="Entrada">Entrada</option>
                        <option value="Sopa">Sopa</option>
                        <option value="Café da Manhã">Café da Manhã</option>
                        <option value="Acompanhamento">Acompanhamento</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cozinha">Cozinha:</label>
                    <select id="cozinha" name="cozinha">
                        <option value="">Todas</option>
                        <option value="Brasileira">Brasileira</option>
                        <option value="Italiana">Italiana</option>
                        <option value="Francesa">Francesa</option>
                        <option value="Saudável">Saudável</option>
                        <option value="Mediterrânea">Mediterrânea</option>
                        <option value="Árabe">Árabe</option>
                        <option value="Internacional">Internacional</option>
                    </select>
                </div>

                <button id="btn-filtrar" type="button" class="btn-filtrar">Filtrar</button>
            </form>

            <!-- Lista de receitas -->
            <div id="lista-receitas" class="receitas-grid"></div>

            <!-- Navegação -->
            <nav>
                <p>Veja também:</p>
                <ul>
                    <li><a href="/">Voltar à Página Inicial</a></li>
                    <li><a href="sobre.html">Sobre a Doença</a></li>
                    <li><a href="alimentacao.html">Recomendações Alimentares</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </main>

        <footer>
            <p>Projeto de Conclusão de Curso - 2025</p>
        </footer>
    </div>
</body>
</html>
